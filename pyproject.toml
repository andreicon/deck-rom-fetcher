[project]
name = "deck-rom-fetcher"
version = "0.2.0"
description = "Graphical ROM fetcher for Steam Deck: Redump lists + Archive.org files into EmuDeck ROM folders."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "httpx>=0.27", "pyyaml>=6", "evdev>=1.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
